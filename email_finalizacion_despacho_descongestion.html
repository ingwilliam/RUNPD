<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proceso Finalizado por Medida de Descongestión — PEYGI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; background-color: #f4f6f8; font-family: 'Inter', Arial, sans-serif; color: #334155;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed; background-color: #f4f6f8; padding: 20px 0;">
        <tr>
            <td align="center">
                <table border="0" cellpadding="0" cellspacing="0" width="680" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);">

                    <!-- ENCABEZADO CON LOS DOS LOGOS -->
                    <tr>
                        <td align="center" style="background-color: #ffffff; padding: 20px 30px; border-bottom: 2px solid #e2e8f0;">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="left" style="vertical-align: middle;"><img src="img/layout_set_logo.jpeg" alt="Logo Institucional" width="120" style="display: block; max-height: 50px; object-fit: contain;"></td>
                                    <td align="right" style="vertical-align: middle;"><img src="img/Logo_PEYGI_sin_fondo.png" alt="Logo UDAE / PEYGI" width="120" style="display: block; max-height: 50px; object-fit: contain;"></td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- DESTINATARIO Y FECHA -->
                    <tr>
                        <td style="background-color: #f8fafc; padding: 12px 30px; border-bottom: 1px solid #e2e8f0; font-size: 12px; color: #64748b;">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="left"><strong style="color: #334155;">Para:</strong> <span id="lbl-para"></span><br><strong style="color: #334155;">CC:</strong> <span id="lbl-cc"></span></td>
                                    <td align="right"><strong style="color: #334155;">Fecha:</strong> <span id="lbl-fecha-top"></span></td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 35px 30px;" id="contenido"></td>
                    </tr>

                    <!-- PIE DE PÁGINA -->
                    <tr>
                        <td align="center" style="background-color: #f8fafc; padding: 20px; border-top: 1px solid #e2e8f0; font-size: 12px; color: #64748b;">
                            <p style="margin: 0 0 5px 0;">Unidad de Desarrollo y Análisis Estadístico (UDAE) — Sistema PEYGI</p>
                            <p style="margin: 0;">Este es un mensaje automático generado por el sistema. Por favor no responda a este correo.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <script>
        const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const fecha = iso => { if (!iso) return "—"; const [a, m, d] = iso.split("-"); return `${d}/${m}/${a}`; };
        const fila = (etiqueta, valor) => `<tr><td width="40%" style="font-weight: 600; color: #64748b; vertical-align: top;">${etiqueta}</td><td>${valor}</td></tr>`;
        const titulo = t => `<h3 style="font-size: 14px; font-weight: 600; color: #1e3a8a; margin: 0 0 12px 0; text-transform: uppercase; letter-spacing: 0.5px;">${t}</h3>`;
        const caja = contenido => `<table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f8fafc; border-radius: 6px; border: 1px solid #e2e8f0; margin-bottom: 25px;"><tr><td style="padding: 20px;">${contenido}</td></tr></table>`;
        const actuaciones = lista => !lista || !lista.length
            ? `<p style="font-size: 13px; color: #64748b; margin: 0 0 25px 0;">No se registraron actuaciones en el despacho destino.</p>`
            : `<table border="0" cellpadding="8" cellspacing="0" width="100%" style="border-collapse: collapse; border: 1px solid #e2e8f0; font-size: 12px; margin-bottom: 25px;">
                <tr style="background-color: #f8fafc; color: #475569; text-align: left;"><th style="padding: 8px; border-bottom: 2px solid #e2e8f0;">Fecha</th><th style="padding: 8px; border-bottom: 2px solid #e2e8f0;">Estado procesal registrado</th></tr>
                ${lista.map(a => `<tr><td style="padding: 8px; border-bottom: 1px solid #e2e8f0; white-space: nowrap;">${fecha(a.fecha)}</td><td style="padding: 8px; border-bottom: 1px solid #e2e8f0;">${esc(a.estadoProceso)}</td></tr>`).join("")}
               </table>`;

        function leerDatos(ejemplo) {
            const dataParam = new URLSearchParams(window.location.search).get("data");
            if (!dataParam) return ejemplo;
            try { return JSON.parse(dataParam); } // URLSearchParams ya entrega el texto decodificado
            catch (error) { console.error("Error al procesar los datos del correo:", error); return ejemplo; }
        }

        function encabezado(d, fechaCorreo) {
            const a = d.destinatario.administrador || {};
            document.getElementById("lbl-para").textContent = a.correo ? `${a.nombre} <${a.correo}>` : d.destinatario.despacho;
            document.getElementById("lbl-cc").textContent = `Consejo Seccional de ${d.consejoSeccional} (supervisión)`;
            document.getElementById("lbl-fecha-top").textContent = fecha(fechaCorreo);
        }

        // Ejemplo (se muestra si el correo se abre sin datos)
        const EJEMPLO = {
            consejoSeccional: "CALDAS",
            despacho: { nombre: "JUZGADO 801 LABORAL MUNICIPAL TRANSITORIO DE MANIZALES", codigo: "170014005801",
                        administrador: { nombre: "Laura Giraldo Henao", correo: "lgiraldo@cendoj.ramajudicial.gov.co", celular: "3015562390" } },
            destinatario: { despacho: "JUZGADO 003 LABORAL DEL CIRCUITO DE MANIZALES",
                            administrador: { nombre: "Ana María Ospina Valencia", correo: "aospinav@cendoj.ramajudicial.gov.co", celular: "3127784410" } },
            medida: "Acuerdo PCSJA26-11234 de 2026",
            fechaTerminacion: "2026-06-18",
            formaTerminacion: "Sentencia ejecutoriada",
            observacion: "Sentencia favorable al demandante.",
            proceso: {
                codigo: "17001310500120210033300",
                fechaRecepcion: "2026-03-01",
                link: "",
                demandantes: ["Rubén Darío Cardona Gil"],
                demandados: ["COLPENSIONES"],
                actuaciones: [
                    { fecha: "2026-03-03", estadoProceso: "Auto que asume el conocimiento" },
                    { fecha: "2026-04-12", estadoProceso: "Sentencia" },
                    { fecha: "2026-06-10", estadoProceso: "Liquidación de costas, entrega de títulos, levantamiento de medidas cautelares u oficios" }
                ]
            }
        };

        document.addEventListener("DOMContentLoaded", () => {
            const d = leerDatos(EJEMPLO);
            const a = d.destinatario.administrador || {};
            const p = d.proceso;
            encabezado(d, d.fechaTerminacion);

            document.getElementById("contenido").innerHTML = `
                <h1 style="font-size: 20px; font-weight: 700; color: #0f172a; margin: 0 0 15px 0;">🏁 Proceso Finalizado en el Despacho Destino</h1>
                <p style="font-size: 15px; line-height: 1.6; color: #475569; margin: 0 0 25px 0;">
                    Cordial saludo, <strong style="color: #0f172a;">${esc(a.nombre || "")}</strong>, Administrador(a) del Despacho del
                    <strong style="color: #0f172a;">${esc(d.destinatario.despacho)}</strong>.
                    Le informamos que el proceso que su despacho envió en el marco del <strong>${esc(d.medida)}</strong> fue
                    <strong style="background-color: #dcfce7; color: #166534; padding: 2px 6px; border-radius: 4px; border: 1px solid #bbf7d0;">finalizado</strong>
                    por el <strong>${esc(d.despacho.nombre)}</strong>.
                </p>

                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f0fdf4; border: 1px solid #bbf7d0; border-left: 5px solid #16a34a; border-radius: 6px; margin-bottom: 25px;">
                    <tr><td style="padding: 18px 20px;">
                        <div style="font-size: 12px; font-weight: 600; color: #166534; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">🏁 Terminación del proceso</div>
                        <div style="font-size: 16px; font-weight: 700; color: #14532d;">${esc(d.formaTerminacion)}</div>
                        <div style="font-size: 13px; color: #166534; margin-top: 4px;">Fecha de terminación: <strong>${fecha(d.fechaTerminacion)}</strong></div>
                        ${d.observacion ? `<div style="font-size: 13px; color: #14532d; margin-top: 8px; background: #ffffff; border: 1px solid #bbf7d0; border-radius: 4px; padding: 8px 10px;"><strong>Observación:</strong> ${esc(d.observacion)}</div>` : ""}
                    </td></tr>
                </table>

                ${caja(titulo("📋 Datos del proceso") + `
                    <table border="0" cellpadding="5" cellspacing="0" width="100%" style="font-size: 14px; color: #334155;">
                        ${fila("Código del proceso:", `<span style="font-family: monospace; font-weight: 700; color: #166534;">${esc(p.codigo)}</span>`)}
                        ${fila("Demandante(s):", esc(p.demandantes.join(", ")))}
                        ${fila("Demandado(s):", esc(p.demandados.join(", ")))}
                        ${fila("Medida de descongestión:", esc(d.medida))}
                        ${fila("Despacho destino:", `${esc(d.despacho.nombre)}<br><span style="color: #64748b; font-size: 12px;">Administrador(a): ${esc(d.despacho.administrador ? d.despacho.administrador.nombre : "")}</span>`)}
                        ${fila("Recibido en el destino:", fecha(p.fechaRecepcion))}
                        ${p.link ? fila("Expediente:", `<a href="${esc(p.link)}" style="color: #0284c7;">🔗 Ver en la Rama Judicial</a>`) : ""}
                    </table>`)}

                ${titulo("🕒 Actuaciones registradas en el despacho destino")}
                ${actuaciones(p.actuaciones)}

                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 10px;">
                    <tr><td style="background-color: #f0f9ff; border: 1px solid #bae6fd; border-radius: 6px; padding: 12px 15px; font-size: 13px; color: #0c4a6e; line-height: 1.5;">
                        ℹ️ Esta notificación se envía únicamente al administrador del despacho origen. El proceso queda cerrado en el sistema y su trazabilidad completa puede consultarse en PEYGI.
                    </td></tr>
                </table>`;
        });
    </script>
</body>
</html>
